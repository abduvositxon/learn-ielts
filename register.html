<!DOCTYPE html>
<html>
  <head>
    <title>Ro'yxatdan o'tish</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: Arial, sans-serif; background: linear-gradient(135deg, #1e40af, #3b82f6); min-height: 100vh; display: flex; align-items: center; justify-content: center; }
      .form-box { background: white; padding: 40px; border-radius: 20px; width: 400px; box-shadow: 0 10px 40px rgba(0,0,0,0.2); }
      .form-box h2 { text-align: center; color: #1e40af; margin-bottom: 30px; font-size: 28px; }
      .input-group { margin-bottom: 20px; }
      .input-group label { display: block; color: #555; margin-bottom: 8px; font-size: 14px; }
      .input-group input { width: 100%; padding: 12px 15px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; outline: none; }
      .input-group input:focus { border-color: #2563eb; }
      button { width: 100%; padding: 14px; background-color: #2563eb; color: white; border: none; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; }
      .xabar { text-align: center; margin-top: 15px; font-size: 14px; padding: 10px; border-radius: 8px; display: none; }
      .xabar.success { background: #dcfce7; color: #16a34a; display: block; }
      .xabar.error { background: #fee2e2; color: #dc2626; display: block; }
      .login-link { text-align: center; margin-top: 20px; font-size: 14px; color: #555; }
      .login-link a { color: #2563eb; text-decoration: none; }
    </style>
  </head>
  <body>

    <div class="form-box">
      <h2>📝 Ro'yxatdan o'tish</h2>

      <div class="input-group">
        <label>Ismingiz</label>
        <input type="text" id="name" placeholder="Ismingizni kiriting">
      </div>

      <div class="input-group">
        <label>Email</label>
        <input type="email" id="email" placeholder="email@gmail.com">
      </div>

      <div class="input-group">
        <label>Parol</label>
        <input type="password" id="password" placeholder="Parol kiriting">
      </div>

      <button id="regBtn">Ro'yxatdan o'tish</button>

      <div class="xabar" id="xabar"></div>

      <div class="login-link">
        <p>Hisobingiz bormi? <a href="login.html">Kirish</a></p>
      </div>
    </div>

    <script>
      const DB = window.supabase.createClient(
        'https://astwrxgbjjmgsccrvaxj.supabase.co',
        'sb_publishable_2ZRm8hql_0W5PfZd4hkalw_jbq_giSk'
      );

      document.getElementById('regBtn').addEventListener('click', async function() {
        let ism = document.getElementById('name').value;
        let email = document.getElementById('email').value;
        let parol = document.getElementById('password').value;
        let xabar = document.getElementById('xabar');

        if (ism === '' || email === '' || parol === '') {
          xabar.className = 'xabar error';
          xabar.textContent = 'Iltimos, barcha maydonlarni to\'ldiring!';
          return;
        }

        if (parol.length < 6) {
          xabar.className = 'xabar error';
          xabar.textContent = 'Parol kamida 6 ta belgi bo\'lishi kerak!';
          return;
        }

        const { data, error } = await DB
          .from('users')
          .insert([{ ism: ism, email: email, parol: parol }]);

        if (error) {
          xabar.className = 'xabar error';
          xabar.textContent = 'Xatolik: ' + error.message;
        } else {
          xabar.className = 'xabar success';
          xabar.textContent = 'Tabriklaymiz ' + ism + '! Muvaffaqiyatli ro\'yxatdan o\'tdingiz!';
          setTimeout(() => { window.location.href = 'login.html'; }, 2000);
        }
      });
    </script>

  </body>
</html>
