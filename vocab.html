<!DOCTYPE html>
<html>
  <head>
    <title>Vocab</title>
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body { font-family: Arial, sans-serif; background-color: #f0f4f8; }
      nav { display: flex; justify-content: space-between; align-items: center; background-color: #1e40af; padding: 15px 30px; }
      .logo { color: white; font-size: 24px; font-weight: bold; cursor: pointer; }
      nav ul { list-style: none; display: flex; gap: 20px; }
      nav ul li a { color: white; text-decoration: none; font-size: 16px; }
      .hero { text-align: center; padding: 40px 20px; background: linear-gradient(135deg, #1e40af, #3b82f6); color: white; }
      .hero h1 { font-size: 36px; margin-bottom: 10px; }
      .hero p { font-size: 18px; }
      .vocab-box { max-width: 600px; margin: 50px auto; background: white; border-radius: 20px; padding: 40px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); text-align: center; }
      .word { font-size: 48px; font-weight: bold; color: #1e40af; margin-bottom: 10px; }
      .listen-btn { background: none; border: 2px solid #1e40af; color: #1e40af; padding: 8px 20px; border-radius: 20px; cursor: pointer; font-size: 16px; margin-bottom: 15px; }
      .pronunciation { font-size: 18px; color: #888; margin-bottom: 20px; }
      .meaning { font-size: 20px; color: #333; margin-bottom: 10px; }
      .example { font-size: 16px; color: #555; font-style: italic; margin-bottom: 30px; padding: 15px; background: #f0f4f8; border-radius: 10px; }
      .buttons { display: flex; gap: 15px; justify-content: center; }
      .btn-bilaman { background: #22c55e; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; }
      .btn-bilmayman { background: #ef4444; color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 16px; cursor: pointer; font-weight: bold; }
      .progress { max-width: 600px; margin: 0 auto 20px; text-align: center; color: #555; font-size: 16px; }
      .progress-bar { background: #e2e8f0; border-radius: 10px; height: 10px; margin-top: 8px; }
      .progress-fill { background: #2563eb; height: 10px; border-radius: 10px; transition: width 0.3s; }
      footer { background-color: #1e40af; color: white; text-align: center; padding: 20px; margin-top: 50px; }
    </style>
  </head>
  <body>

    <nav>
      <div class="logo" onclick="window.location.href='index.html'">LearnIELTS</div>
      <ul>
        <li><a href="index.html">Bosh sahifa</a></li>
        <li><a href="kurslar.html">Kurslar</a></li>
        <li><a href="vocab.html">Vocab</a></li>
        <li><a href="taymer.html">Taymer</a></li>
      </ul>
    </nav>

    <div class="hero">
      <h1>📝 Vocab</h1>
      <p>Ingliz so'zlarini oson va tez yodlang</p>
    </div>

    <div class="progress">
      <span id="progress-text">1 / 10 so'z</span>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-fill" style="width: 10%"></div>
      </div>
    </div>

    <div class="vocab-box">
      <div class="word" id="word">Abundant</div>
      <button class="listen-btn" onclick="ovozli()">🔊 Tinglash</button>
      <div class="pronunciation" id="pronunciation">[ ə-BUN-dənt ]</div>
      <div class="meaning" id="meaning">🇺🇿 Ko'p, mo'l-ko'l</div>
      <div class="example" id="example">"There is abundant evidence that exercise is good for you."</div>
      <div class="buttons">
        <button class="btn-bilmayman" onclick="keyingi()">❌ Bilmadim</button>
        <button class="btn-bilaman" onclick="keyingi()">✅ Bildim</button>
      </div>
    </div>

    <footer>
      <p>© 2026 LearnIELTS — Barcha huquqlar himoyalangan</p>
    </footer>

    <script>
      const sozlar = [
        { word: "Abundant", pronunciation: "[ ə-BUN-dənt ]", meaning: "🇺🇿 Ko'p, mo'l-ko'l", example: "There is abundant evidence that exercise is good for you." },
        { word: "Ambiguous", pronunciation: "[ am-BIG-yoo-əs ]", meaning: "🇺🇿 Noaniq, ikki ma'noli", example: "The instructions were ambiguous and confusing." },
        { word: "Benevolent", pronunciation: "[ bə-NEV-ə-lənt ]", meaning: "🇺🇿 Xayrixoh, mehribon", example: "She was a benevolent leader who cared about her people." },
        { word: "Comprehensive", pronunciation: "[ kom-prə-HEN-siv ]", meaning: "🇺🇿 To'liq, keng qamrovli", example: "We need a comprehensive plan to solve this problem." },
        { word: "Deteriorate", pronunciation: "[ dih-TEER-ee-ə-rayt ]", meaning: "🇺🇿 Yomonlashmoq, pasaymoq", example: "His health began to deteriorate rapidly." },
        { word: "Elaborate", pronunciation: "[ ih-LAB-ər-it ]", meaning: "🇺🇿 Batafsil, murakkab", example: "She gave an elaborate explanation of the process." },
        { word: "Flourish", pronunciation: "[ FLUR-ish ]", meaning: "🇺🇿 Gullab-yashnash, rivojlanmoq", example: "Businesses flourish in a stable economy." },
        { word: "Inevitable", pronunciation: "[ in-EV-i-tə-bəl ]", meaning: "🇺🇿 Muqarrar, oldini bo'lmas", example: "Change is inevitable in life." },
        { word: "Justify", pronunciation: "[ JUS-tə-fy ]", meaning: "🇺🇿 Asoslash, oqlash", example: "Can you justify your decision?" },
        { word: "Mitigate", pronunciation: "[ MIT-i-gayt ]", meaning: "🇺🇿 Yumshatmoq, kamaytirmoq", example: "We must mitigate the effects of climate change." }
      ];

      let joriy = 0;

      function ovozli() {
        let soz = document.getElementById('word').textContent;
        let utterance = new SpeechSynthesisUtterance(soz);
        utterance.lang = 'en-US';
        utterance.rate = 0.8;
        speechSynthesis.speak(utterance);
      }

      function keyingi() {
        joriy++;
        if (joriy >= sozlar.length) {
          alert('Tabriklaymiz! Barcha so\'zlarni ko\'rdingiz! 🎉');
          joriy = 0;
        }
        document.getElementById('word').textContent = sozlar[joriy].word;
        document.getElementById('pronunciation').textContent = sozlar[joriy].pronunciation;
        document.getElementById('meaning').textContent = sozlar[joriy].meaning;
        document.getElementById('example').textContent = '"' + sozlar[joriy].example + '"';
        document.getElementById('progress-text').textContent = (joriy + 1) + ' / ' + sozlar.length + ' so\'z';
        document.getElementById('progress-fill').style.width = ((joriy + 1) / sozlar.length * 100) + '%';
      }
    </script>

  </body>
</html>
